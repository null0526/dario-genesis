const Q = new URLSearchParams(location.search);
const W = 1920, H = 1080, FPS = 30, SUBS = Q.get('subs') !== '0';

const DURATION = 44.52;
const EV = { slip: 4.18, rub: 5.56, toSheet: 7.9, pi: 8.98, seal: 10.92, call: 12.94, draw: 13.05, pay: 14.42, cut: 16.10, hex: 17.39,

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

// ---------- 画笔 ----------
const JIT = (() => { const r = rng(77), a = []; for (let i = 0; i < 4096; i++) a.push(r() - .5); return a; })();

const SPLITS = [[EV.split, 12], [EV.split + .38, 24], [EV.split + .76, 48], [EV.split + 1.14, 96], [EV.split + 1.50, 192]];

// 纸面内容（局部坐标，原点在 SHEET 中心）；full=true 时画最终状态（给副本用）
